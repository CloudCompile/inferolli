name: keeper

# Inferolli's sandbox extends its own timeout every 2 minutes, so it should never
# expire. Two things can still take it down, and neither of them involves the
# VPS being awake:
#
#   * E2B caps sandbox lifetime at 24h. Pause + resume resets that window, so
#     once a day the bot pauses itself on purpose and waits to be resumed.
#   * A sandbox can be killed outright (quota, manual mistake, a bad experiment).
#
# The VPS shepherd used to be the only thing doing either job — and the VPS is
# powered off most of the night, so a bot that paused at 22:00 sat dead until
# morning. That is the outage this job ends.
#
# It extends, resumes the newest paused sandbox, or creates one. Creating does
# not need anyone to write files into the sandbox: the secrets go in through the
# creation environment, which reaches the start command, and start.sh rebuilds
# /bot/.env from them (and then restores the real one from S3).
#
# Requires these repository secrets:
#   E2B_API_KEY, DISCORD_BOT_TOKEN, INFERENCEPORT_API_KEY, AI_GATEWAY_KEY,
#   S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
#   TONEARM_URL, TONEARM_API_KEY, TINYFISH_API_KEY
# Missing ones are simply not passed; the S3 restore fills the gaps.

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: extend, resume, or create
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          INFERENCEPORT_API_KEY: ${{ secrets.INFERENCEPORT_API_KEY }}
          AI_GATEWAY_KEY: ${{ secrets.AI_GATEWAY_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          TONEARM_URL: ${{ secrets.TONEARM_URL }}
          TONEARM_API_KEY: ${{ secrets.TONEARM_API_KEY }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: python3 scripts/keeper.py --json
